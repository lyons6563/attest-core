<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
    }
    h1 {
      margin: 0 0 12px 0;
      font-size: 18px;
      font-weight: 600;
    }
    .status {
      margin: 8px 0;
      padding: 8px;
      background: #f5f5f5;
      border-radius: 4px;
    }
    .status-label {
      font-weight: 600;
      color: #666;
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .status-value {
      color: #000;
      word-break: break-all;
      font-size: 13px;
    }
    .error {
      color: #d32f2f;
      background: #ffebee;
      padding: 8px;
      border-radius: 4px;
      margin-top: 8px;
    }
    .success {
      color: #2e7d32;
    }
    .timestamp {
      color: #666;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <h1>Decision Engine Recorder</h1>
  
  <div class="status">
    <div class="status-label">Last Event ID</div>
    <div class="status-value" id="lastEventId">-</div>
    <div class="timestamp" id="lastEventTime">-</div>
  </div>
  
  <div class="status">
    <div class="status-label">Session ID</div>
    <div class="status-value" id="sessionId">Loading...</div>
  </div>
  
  <div id="errorContainer" style="display: none;">
    <div class="error" id="lastError"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
